[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rahat"
version = "1.0.1"
description = "RAHAT: Real-time Agentic Help And Triage. A multi-agent flood response command center on Microsoft Foundry."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Rohit Bharti" }]
dependencies = [
  "agent-framework-core>=1.12",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "openai>=1.60",
  "pydantic>=2.7",
  "prometheus-client>=0.20",
  "python-dotenv>=1.0",
  "segno>=1.6",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff==0.8.6"]
telemetry = ["azure-monitor-opentelemetry>=1.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rahat = ["data/*.json", "web/*", "web/vendor/leaflet/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
