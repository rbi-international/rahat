<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="1200" height="700" viewBox="0 0 1200 700" font-family="Arial, Helvetica, sans-serif">
<rect width="100%" height="100%" fill="#F7F3EA"/>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker>
</defs>
<g fill="#1F2328" font-size="13">
<text x="30" y="42" font-size="22" font-weight="bold">RAHAT architecture</text>
<text x="30" y="66">Arrows show who calls whom. Everything runs in one process except the external services.</text>

<!-- clients -->
<rect x="30" y="100" width="220" height="76" rx="8" fill="#DFF3E3" stroke="#15803D" stroke-width="1.5"/>
<text x="140" y="124" text-anchor="middle" font-size="14" font-weight="bold">Citizen phone</text>
<text x="140" y="146" text-anchor="middle">/sos, joined by QR</text>
<text x="140" y="164" text-anchor="middle">/j/{code}</text>

<rect x="30" y="196" width="220" height="56" rx="8" fill="#DFF3E3" stroke="#15803D" stroke-width="1.5"/>
<text x="140" y="220" text-anchor="middle" font-size="14" font-weight="bold">Officer console</text>
<text x="140" y="240" text-anchor="middle">/console</text>

<rect x="30" y="272" width="220" height="72" rx="8" fill="#DFF3E3" stroke="#15803D" stroke-width="1.5"/>
<text x="140" y="300" text-anchor="middle" font-size="14" font-weight="bold">Control-room wall</text>
<text x="140" y="322" text-anchor="middle">/wall</text>

<line x1="250" y1="138" x2="300" y2="138" stroke="#374151" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="250" y1="224" x2="300" y2="224" stroke="#374151" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="250" y1="296" x2="300" y2="296" stroke="#374151" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="300" y1="330" x2="250" y2="330" stroke="#374151" stroke-width="1.6" stroke-dasharray="5,3" marker-end="url(#ah)"/>
<text x="275" y="320" text-anchor="middle" font-size="12">SSE</text>

<!-- FastAPI -->
<rect x="300" y="100" width="300" height="244" rx="8" fill="#DCEBFA" stroke="#1D4ED8" stroke-width="1.5"/>
<text x="450" y="128" text-anchor="middle" font-size="16" font-weight="bold">FastAPI app</text>
<text x="450" y="148" text-anchor="middle">src/rahat/api.py</text>
<line x1="316" y1="162" x2="584" y2="162" stroke="#1D4ED8" stroke-width="1"/>
<text x="318" y="188">access.py: session code,</text>
<text x="318" y="206">device cookie, rate limit</text>
<text x="318" y="236">/api/sos: an SOS comes in</text>
<text x="318" y="264">/api/stream: SSE to the screens</text>
<text x="318" y="292">/metrics: Prometheus text</text>

<!-- queue -->
<line x1="600" y1="141" x2="650" y2="141" stroke="#374151" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="625" y="133" text-anchor="middle" font-size="12">SOS id</text>
<rect x="650" y="100" width="290" height="82" rx="8" fill="#DCEBFA" stroke="#1D4ED8" stroke-width="1.5"/>
<text x="795" y="124" text-anchor="middle" font-size="14" font-weight="bold">Queue + workers (pipeline.py)</text>
<text x="795" y="146" text-anchor="middle">asyncio.Queue, QUEUE_MAX 800</text>
<text x="795" y="166" text-anchor="middle">WORKERS pool (default 12)</text>

<line x1="795" y1="182" x2="795" y2="210" stroke="#374151" stroke-width="1.6" marker-end="url(#ah)"/>

<!-- workflow -->
<rect x="650" y="210" width="290" height="90" rx="8" fill="#DCEBFA" stroke="#1D4ED8" stroke-width="1.5"/>
<text x="795" y="234" text-anchor="middle" font-size="14" font-weight="bold">Workflow per SOS (workflow.py)</text>
<text x="795" y="256" text-anchor="middle">build_workflow(), Agent Framework</text>
<text x="795" y="276" text-anchor="middle">fresh executors for each SOS</text>

<line x1="795" y1="300" x2="795" y2="330" stroke="#374151" stroke-width="1.6" marker-end="url(#ah)"/>

<!-- gateway -->
<rect x="650" y="330" width="290" height="80" rx="8" fill="#DCEBFA" stroke="#1D4ED8" stroke-width="1.5"/>
<text x="795" y="354" text-anchor="middle" font-size="14" font-weight="bold">Model gateway (llm.py)</text>
<text x="795" y="376" text-anchor="middle">complete_json(): ledger, breaker,</text>
<text x="795" y="396" text-anchor="middle">fallback, metrics</text>

<line x1="795" y1="410" x2="795" y2="450" stroke="#374151" stroke-width="1.6" stroke-dasharray="5,3" marker-end="url(#ah)"/>
<text x="806" y="434" font-size="12">no model answer</text>

<rect x="650" y="450" width="290" height="60" rx="8" fill="#DCEBFA" stroke="#1D4ED8" stroke-width="1.5"/>
<text x="795" y="474" text-anchor="middle" font-size="14" font-weight="bold">SOP rules (rules.py)</text>
<text x="795" y="494" text-anchor="middle">the floor under every agent</text>

<!-- external -->
<line x1="940" y1="255" x2="985" y2="255" stroke="#374151" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="962" y="247" text-anchor="middle" font-size="12">guard</text>
<rect x="985" y="200" width="195" height="110" rx="8" fill="#EDE4F7" stroke="#6D28D9" stroke-width="1.5"/>
<text x="1082" y="224" text-anchor="middle" font-size="14" font-weight="bold">Azure AI</text>
<text x="1082" y="243" text-anchor="middle" font-size="14" font-weight="bold">Content Safety</text>
<text x="1082" y="266" text-anchor="middle">Prompt Shields, called by</text>
<text x="1082" y="288" text-anchor="middle">guardrails/injection.py</text>

<line x1="940" y1="370" x2="985" y2="370" stroke="#374151" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="985" y="330" width="195" height="100" rx="8" fill="#EDE4F7" stroke="#6D28D9" stroke-width="1.5"/>
<text x="1082" y="354" text-anchor="middle" font-size="14" font-weight="bold">Microsoft Foundry</text>
<text x="1082" y="376" text-anchor="middle">deployments:</text>
<text x="1082" y="396" text-anchor="middle">rahat-fast, rahat-strong</text>
<text x="1082" y="416" text-anchor="middle">(gpt-5-mini)</text>

<!-- state -->
<rect x="300" y="390" width="300" height="80" rx="8" fill="#FFF6C7" stroke="#A16207" stroke-width="1.5"/>
<text x="450" y="414" text-anchor="middle" font-size="14" font-weight="bold">In-memory state</text>
<text x="450" y="436" text-anchor="middle">store.py board, ledger,</text>
<text x="450" y="456" text-anchor="middle">router, audit</text>
<line x1="650" y1="276" x2="600" y2="412" stroke="#374151" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="650" y1="396" x2="600" y2="446" stroke="#374151" stroke-width="1.6" marker-end="url(#ah)"/>

<!-- legend -->
<text x="30" y="404" font-size="13" font-weight="bold">Colour key</text>
<rect x="30" y="416" width="16" height="16" rx="3" fill="#DCEBFA" stroke="#1D4ED8"/>
<text x="54" y="429">plain code</text>
<rect x="30" y="442" width="16" height="16" rx="3" fill="#DFF3E3" stroke="#15803D"/>
<text x="54" y="455">people and their screens</text>
<rect x="30" y="468" width="16" height="16" rx="3" fill="#EDE4F7" stroke="#6D28D9"/>
<text x="54" y="481">external service</text>
<rect x="30" y="494" width="16" height="16" rx="3" fill="#FFF6C7" stroke="#A16207"/>
<text x="54" y="507">state in memory</text>

<!-- monitoring -->
<line x1="450" y1="470" x2="450" y2="560" stroke="#374151" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="462" y="520" font-size="12">metrics, traces, audit lines</text>
<rect x="30" y="560" width="1150" height="110" rx="8" fill="#EDE4F7" stroke="#6D28D9" stroke-width="1.5"/>
<text x="605" y="584" text-anchor="middle" font-size="14" font-weight="bold">Monitoring</text>
<text x="605" y="608" text-anchor="middle">/metrics -&gt; Prometheus -&gt; Grafana (15 panels)</text>
<text x="605" y="630" text-anchor="middle">OpenTelemetry -&gt; Application Insights (telemetry.py)</text>
<text x="605" y="652" text-anchor="middle">audit JSON lines on stdout -&gt; Log Analytics</text>
</g>
</svg>
