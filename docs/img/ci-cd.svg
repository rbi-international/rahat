<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="1280" height="690" viewBox="0 0 1280 690" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#F7F3EA"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606A"/>
    </marker>
  </defs>

  <text x="640" y="36" font-size="22" font-weight="bold" fill="#1F2328" text-anchor="middle">CI and deploy</text>
  <text x="640" y="60" font-size="14" fill="#57606A" text-anchor="middle">.github/workflows/ci.yml checks every change; deploy.yml ships a tagged release to Azure Container Apps</text>

  <!-- ===== ci.yml ===== -->
  <text x="20" y="92" font-size="16" font-weight="bold" fill="#1F2328">ci.yml</text>
  <rect x="20" y="110" width="150" height="110" rx="8" fill="#EDE4F7" stroke="#6D28D9" stroke-width="1.5"/>
  <text x="95" y="134" font-size="14" font-weight="bold" fill="#1F2328" text-anchor="middle">Triggers</text>
  <text x="95" y="156" font-size="12" fill="#1F2328" text-anchor="middle">push to main</text>
  <text x="95" y="174" font-size="12" fill="#1F2328" text-anchor="middle">pull_request</text>
  <text x="95" y="192" font-size="12" fill="#1F2328" text-anchor="middle">workflow_call</text>
  <line x1="170" y1="165" x2="200" y2="165" stroke="#57606A" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="200" y="100" width="1005" height="170" rx="10" fill="#FDFBF6" stroke="#8C959F" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="215" y="124" font-size="14" font-weight="bold" fill="#1F2328">job: test (ubuntu-latest, Python 3.12)</text>

  <rect x="215" y="140" width="110" height="118" rx="6" fill="#DCEBFA" stroke="#1D4ED8"/>
  <text x="270" y="162" font-size="13" font-weight="bold" fill="#1F2328" text-anchor="middle">Checkout</text>
  <text x="270" y="180" font-size="12" fill="#1F2328" text-anchor="middle">actions/checkout</text>

  <rect x="345" y="140" width="130" height="118" rx="6" fill="#DCEBFA" stroke="#1D4ED8"/>
  <text x="410" y="162" font-size="13" font-weight="bold" fill="#1F2328" text-anchor="middle">Install</text>
  <text x="410" y="180" font-size="12" fill="#1F2328" text-anchor="middle">pip install -e</text>
  <text x="410" y="196" font-size="12" fill="#1F2328" text-anchor="middle">".[dev]"</text>

  <rect x="495" y="140" width="140" height="118" rx="6" fill="#DCEBFA" stroke="#1D4ED8"/>
  <text x="565" y="162" font-size="13" font-weight="bold" fill="#1F2328" text-anchor="middle">Lint</text>
  <text x="565" y="180" font-size="12" fill="#1F2328" text-anchor="middle">ruff check</text>
  <text x="565" y="196" font-size="12" fill="#1F2328" text-anchor="middle">src tests scripts</text>
  <text x="565" y="212" font-size="12" fill="#1F2328" text-anchor="middle">(ruff pinned)</text>

  <rect x="655" y="140" width="120" height="118" rx="6" fill="#DCEBFA" stroke="#1D4ED8"/>
  <text x="715" y="162" font-size="13" font-weight="bold" fill="#1F2328" text-anchor="middle">Test</text>
  <text x="715" y="180" font-size="12" fill="#1F2328" text-anchor="middle">pytest -q</text>
  <text x="715" y="196" font-size="12" fill="#1F2328" text-anchor="middle">all offline,</text>
  <text x="715" y="212" font-size="12" fill="#1F2328" text-anchor="middle">fake lane</text>

  <rect x="795" y="140" width="200" height="118" rx="6" fill="#DCEBFA" stroke="#1D4ED8"/>
  <text x="895" y="162" font-size="13" font-weight="bold" fill="#1F2328" text-anchor="middle">Rehearsal</text>
  <text x="895" y="180" font-size="12" fill="#1F2328" text-anchor="middle">uvicorn, PROVIDER=fake</text>
  <text x="895" y="196" font-size="12" fill="#1F2328" text-anchor="middle">simulate_class.py</text>
  <text x="895" y="212" font-size="12" fill="#1F2328" text-anchor="middle">--students 80 --minutes 2</text>
  <text x="895" y="228" font-size="12" fill="#1F2328" text-anchor="middle">--second-wave 10</text>
  <text x="895" y="244" font-size="12" fill="#1F2328" text-anchor="middle">&gt; rehearsal.json</text>

  <rect x="1015" y="140" width="180" height="118" rx="6" fill="#DCEBFA" stroke="#1D4ED8"/>
  <text x="1105" y="162" font-size="13" font-weight="bold" fill="#1F2328" text-anchor="middle">Eval gate</text>
  <text x="1105" y="180" font-size="12" fill="#1F2328" text-anchor="middle">eval_gate.py, fails if not:</text>
  <text x="1105" y="196" font-size="12" fill="#1F2328" text-anchor="middle">located &gt;= 80%</text>
  <text x="1105" y="212" font-size="12" fill="#1F2328" text-anchor="middle">within one level &gt;= 92%</text>
  <text x="1105" y="228" font-size="12" fill="#1F2328" text-anchor="middle">ranked too low &lt;= 10%</text>
  <text x="1105" y="244" font-size="12" fill="#1F2328" text-anchor="middle">all injection stopped</text>

  <line x1="325" y1="199" x2="345" y2="199" stroke="#57606A" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="475" y1="199" x2="495" y2="199" stroke="#57606A" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="635" y1="199" x2="655" y2="199" stroke="#57606A" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="775" y1="199" x2="795" y2="199" stroke="#57606A" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="995" y1="199" x2="1015" y2="199" stroke="#57606A" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="200" y="300" width="490" height="96" rx="10" fill="#FDFBF6" stroke="#8C959F" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="215" y="322" font-size="14" font-weight="bold" fill="#1F2328">job: image (needs: test)</text>
  <rect x="215" y="332" width="140" height="54" rx="6" fill="#DCEBFA" stroke="#1D4ED8"/>
  <text x="285" y="354" font-size="13" font-weight="bold" fill="#1F2328" text-anchor="middle">docker build</text>
  <text x="285" y="372" font-size="12" fill="#1F2328" text-anchor="middle">rahat:&lt;sha&gt;</text>
  <rect x="375" y="332" width="150" height="54" rx="6" fill="#DCEBFA" stroke="#1D4ED8"/>
  <text x="450" y="354" font-size="13" font-weight="bold" fill="#1F2328" text-anchor="middle">docker run</text>
  <text x="450" y="372" font-size="12" fill="#1F2328" text-anchor="middle">PROVIDER=fake</text>
  <rect x="545" y="332" width="130" height="54" rx="6" fill="#DCEBFA" stroke="#1D4ED8"/>
  <text x="610" y="354" font-size="13" font-weight="bold" fill="#1F2328" text-anchor="middle">curl /healthz</text>
  <text x="610" y="372" font-size="12" fill="#1F2328" text-anchor="middle">up to 20 tries</text>
  <line x1="355" y1="359" x2="375" y2="359" stroke="#57606A" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="525" y1="359" x2="545" y2="359" stroke="#57606A" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="400" y1="270" x2="400" y2="300" stroke="#57606A" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="410" y="290" font-size="12" fill="#57606A">needs: test</text>

  <line x1="20" y1="420" x2="1260" y2="420" stroke="#C9C1B1" stroke-width="1.5"/>

  <!-- ===== deploy.yml ===== -->
  <text x="20" y="450" font-size="16" font-weight="bold" fill="#1F2328">deploy.yml</text>
  <rect x="20" y="480" width="140" height="115" rx="8" fill="#EDE4F7" stroke="#6D28D9" stroke-width="1.5"/>
  <text x="90" y="504" font-size="14" font-weight="bold" fill="#1F2328" text-anchor="middle">Trigger</text>
  <text x="90" y="526" font-size="12" fill="#1F2328" text-anchor="middle">push a tag v*</text>
  <text x="90" y="544" font-size="12" fill="#1F2328" text-anchor="middle">or a manual run</text>
  <text x="90" y="562" font-size="12" fill="#1F2328" text-anchor="middle">(workflow_dispatch)</text>

  <rect x="185" y="480" width="115" height="115" rx="6" fill="#DCEBFA" stroke="#1D4ED8"/>
  <text x="242" y="500" font-size="13" font-weight="bold" fill="#1F2328" text-anchor="middle">uses ci.yml</text>
  <text x="242" y="518" font-size="12" fill="#1F2328" text-anchor="middle">runs the test</text>
  <text x="242" y="534" font-size="12" fill="#1F2328" text-anchor="middle">and image jobs</text>
  <text x="242" y="550" font-size="12" fill="#1F2328" text-anchor="middle">above</text>

  <rect x="323" y="455" width="944" height="150" rx="10" fill="#FDFBF6" stroke="#8C959F" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="335" y="473" font-size="14" font-weight="bold" fill="#1F2328">job: deploy (needs: test, environment: production)</text>

  <rect x="335" y="480" width="125" height="115" rx="6" fill="#DFF3E3" stroke="#15803D"/>
  <text x="397" y="500" font-size="13" font-weight="bold" fill="#1F2328" text-anchor="middle">Approval</text>
  <text x="397" y="518" font-size="12" fill="#1F2328" text-anchor="middle">environment</text>
  <text x="397" y="534" font-size="12" fill="#1F2328" text-anchor="middle">production: a</text>
  <text x="397" y="550" font-size="12" fill="#1F2328" text-anchor="middle">required reviewer</text>
  <text x="397" y="566" font-size="12" fill="#1F2328" text-anchor="middle">approves</text>

  <rect x="480" y="480" width="140" height="115" rx="6" fill="#EDE4F7" stroke="#6D28D9"/>
  <text x="550" y="500" font-size="13" font-weight="bold" fill="#1F2328" text-anchor="middle">azure/login@v3</text>
  <text x="550" y="518" font-size="12" fill="#1F2328" text-anchor="middle">OIDC: the GitHub</text>
  <text x="550" y="534" font-size="12" fill="#1F2328" text-anchor="middle">token is exchanged</text>
  <text x="550" y="550" font-size="12" fill="#1F2328" text-anchor="middle">for an Entra token,</text>
  <text x="550" y="566" font-size="12" fill="#1F2328" text-anchor="middle">no stored secret</text>

  <rect x="640" y="480" width="135" height="115" rx="6" fill="#EDE4F7" stroke="#6D28D9"/>
  <text x="707" y="500" font-size="13" font-weight="bold" fill="#1F2328" text-anchor="middle">Registry login</text>
  <text x="707" y="518" font-size="12" fill="#1F2328" text-anchor="middle">registry token via</text>
  <text x="707" y="534" font-size="12" fill="#1F2328" text-anchor="middle">/oauth2/exchange,</text>
  <text x="707" y="550" font-size="12" fill="#1F2328" text-anchor="middle">docker login</text>
  <text x="707" y="566" font-size="12" fill="#1F2328" text-anchor="middle">(AcrPush)</text>

  <rect x="795" y="480" width="130" height="115" rx="6" fill="#DCEBFA" stroke="#1D4ED8"/>
  <text x="860" y="500" font-size="13" font-weight="bold" fill="#1F2328" text-anchor="middle">Build and push</text>
  <text x="860" y="518" font-size="12" fill="#1F2328" text-anchor="middle">on the runner:</text>
  <text x="860" y="534" font-size="12" fill="#1F2328" text-anchor="middle">rahat:&lt;tag&gt;</text>
  <text x="860" y="550" font-size="12" fill="#1F2328" text-anchor="middle">rahat:latest</text>

  <rect x="945" y="480" width="140" height="115" rx="6" fill="#EDE4F7" stroke="#6D28D9"/>
  <text x="1015" y="500" font-size="13" font-weight="bold" fill="#1F2328" text-anchor="middle">Roll out</text>
  <text x="1015" y="518" font-size="12" fill="#1F2328" text-anchor="middle">az containerapp</text>
  <text x="1015" y="534" font-size="12" fill="#1F2328" text-anchor="middle">update --image</text>
  <text x="1015" y="550" font-size="12" fill="#1F2328" text-anchor="middle">--revision-suffix</text>
  <text x="1015" y="566" font-size="12" fill="#1F2328" text-anchor="middle">v1-0-x</text>

  <rect x="1105" y="480" width="150" height="115" rx="6" fill="#DCEBFA" stroke="#1D4ED8"/>
  <text x="1180" y="500" font-size="13" font-weight="bold" fill="#1F2328" text-anchor="middle">Verify</text>
  <text x="1180" y="518" font-size="12" fill="#1F2328" text-anchor="middle">/healthz and /readyz</text>
  <text x="1180" y="534" font-size="12" fill="#1F2328" text-anchor="middle">both return 200</text>
  <text x="1180" y="550" font-size="12" fill="#1F2328" text-anchor="middle">URL masked, prints</text>
  <text x="1180" y="566" font-size="12" fill="#1F2328" text-anchor="middle">status codes only</text>

  <line x1="160" y1="537" x2="185" y2="537" stroke="#57606A" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="300" y1="537" x2="335" y2="537" stroke="#57606A" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="460" y1="537" x2="480" y2="537" stroke="#57606A" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="620" y1="537" x2="640" y2="537" stroke="#57606A" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="775" y1="537" x2="795" y2="537" stroke="#57606A" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="925" y1="537" x2="945" y2="537" stroke="#57606A" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="1085" y1="537" x2="1105" y2="537" stroke="#57606A" stroke-width="1.5" marker-end="url(#arr)"/>

  <text x="20" y="636" font-size="13" fill="#1F2328">Azure IDs live in repository variables (AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID, AZURE_RG, AZURE_ACR, AZURE_APP). No Azure password or key is stored.</text>

  <!-- Legend -->
  <rect x="20" y="656" width="16" height="16" fill="#DCEBFA" stroke="#1D4ED8"/>
  <text x="42" y="669" font-size="13" fill="#1F2328">runner step</text>
  <rect x="150" y="656" width="16" height="16" fill="#DFF3E3" stroke="#15803D"/>
  <text x="172" y="669" font-size="13" fill="#1F2328">human</text>
  <rect x="240" y="656" width="16" height="16" fill="#EDE4F7" stroke="#6D28D9"/>
  <text x="262" y="669" font-size="13" fill="#1F2328">GitHub or Azure</text>
  <rect x="390" y="656" width="40" height="16" fill="#FDFBF6" stroke="#8C959F" stroke-dasharray="6 4"/>
  <text x="436" y="669" font-size="13" fill="#1F2328">job</text>
</svg>
