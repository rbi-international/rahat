<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="1200" height="800" viewBox="0 0 1200 800" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#F7F3EA"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606A"/>
    </marker>
  </defs>

  <text x="600" y="36" font-size="22" font-weight="bold" fill="#1F2328" text-anchor="middle">Azure resources and who may do what</text>
  <text x="600" y="60" font-size="14" fill="#57606A" text-anchor="middle">Created by infra/azure/provision.sh. Arrows are role assignments, each scoped to one resource.</text>

  <!-- Resource group -->
  <rect x="20" y="80" width="840" height="650" rx="12" fill="#FBF8F2" stroke="#6D28D9" stroke-width="1.5" stroke-dasharray="8 5"/>
  <text x="36" y="104" font-size="16" font-weight="bold" fill="#1F2328">Resource group rahat-rg (eastus2)</text>

  <!-- Foundry -->
  <rect x="40" y="120" width="380" height="170" rx="8" fill="#EDE4F7" stroke="#6D28D9" stroke-width="1.5"/>
  <text x="230" y="144" font-size="15" font-weight="bold" fill="#1F2328" text-anchor="middle">rahat-foundry</text>
  <text x="230" y="163" font-size="12" fill="#1F2328" text-anchor="middle">Foundry resource, kind AIServices, S0</text>
  <rect x="55" y="178" width="170" height="96" rx="6" fill="#FFFFFF" stroke="#6D28D9"/>
  <text x="140" y="198" font-size="13" font-weight="bold" fill="#1F2328" text-anchor="middle">rahat-fast</text>
  <text x="140" y="218" font-size="12" fill="#1F2328" text-anchor="middle">gpt-5-mini</text>
  <text x="140" y="234" font-size="12" fill="#1F2328" text-anchor="middle">GlobalStandard</text>
  <text x="140" y="250" font-size="12" fill="#1F2328" text-anchor="middle">own TPM cap</text>
  <rect x="235" y="178" width="170" height="96" rx="6" fill="#FFFFFF" stroke="#6D28D9"/>
  <text x="320" y="198" font-size="13" font-weight="bold" fill="#1F2328" text-anchor="middle">rahat-strong</text>
  <text x="320" y="218" font-size="12" fill="#1F2328" text-anchor="middle">gpt-5-mini</text>
  <text x="320" y="234" font-size="12" fill="#1F2328" text-anchor="middle">GlobalStandard</text>
  <text x="320" y="250" font-size="12" fill="#1F2328" text-anchor="middle">own TPM cap</text>

  <!-- Content Safety, logs, appi -->
  <rect x="440" y="120" width="400" height="70" rx="8" fill="#EDE4F7" stroke="#6D28D9" stroke-width="1.5"/>
  <text x="640" y="146" font-size="15" font-weight="bold" fill="#1F2328" text-anchor="middle">rahat-safety</text>
  <text x="640" y="168" font-size="12" fill="#1F2328" text-anchor="middle">Azure AI Content Safety (Prompt Shields), F0, region eastus</text>

  <rect x="440" y="210" width="190" height="80" rx="8" fill="#FFF6C7" stroke="#A16207" stroke-width="1.5"/>
  <text x="535" y="236" font-size="15" font-weight="bold" fill="#1F2328" text-anchor="middle">rahat-logs</text>
  <text x="535" y="256" font-size="12" fill="#1F2328" text-anchor="middle">Log Analytics</text>
  <text x="535" y="272" font-size="12" fill="#1F2328" text-anchor="middle">workspace</text>

  <rect x="650" y="210" width="190" height="80" rx="8" fill="#EDE4F7" stroke="#6D28D9" stroke-width="1.5"/>
  <text x="745" y="236" font-size="15" font-weight="bold" fill="#1F2328" text-anchor="middle">rahat-appi</text>
  <text x="745" y="256" font-size="12" fill="#1F2328" text-anchor="middle">Application Insights</text>
  <text x="745" y="272" font-size="12" fill="#1F2328" text-anchor="middle">workspace-based</text>
  <line x1="650" y1="250" x2="630" y2="250" stroke="#57606A" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Container Apps environment -->
  <rect x="40" y="340" width="500" height="250" rx="10" fill="#F1ECE2" stroke="#6D28D9" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="525" y="361" font-size="13" font-weight="bold" fill="#1F2328" text-anchor="end">rahat-env (Container Apps environment)</text>
  <line x1="500" y1="340" x2="500" y2="290" stroke="#57606A" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="508" y="322" font-size="12" fill="#57606A">app logs</text>

  <rect x="60" y="380" width="460" height="190" rx="8" fill="#DCEBFA" stroke="#1D4ED8" stroke-width="1.5"/>
  <rect x="75" y="395" width="170" height="160" rx="6" fill="#EDE4F7" stroke="#6D28D9"/>
  <text x="160" y="466" font-size="13" font-weight="bold" fill="#1F2328" text-anchor="middle">managed identity</text>
  <text x="160" y="484" font-size="12" fill="#1F2328" text-anchor="middle">(system-assigned)</text>
  <text x="260" y="412" font-size="15" font-weight="bold" fill="#1F2328">Container app rahat</text>
  <text x="260" y="432" font-size="12" fill="#1F2328">1 replica, 1 CPU, 2 GiB</text>
  <text x="260" y="450" font-size="12" fill="#1F2328">port 8000</text>
  <rect x="260" y="462" width="245" height="95" rx="6" fill="#FFF6C7" stroke="#A16207"/>
  <text x="272" y="482" font-size="13" font-weight="bold" fill="#1F2328">Secrets (secretref)</text>
  <text x="272" y="500" font-size="12" fill="#1F2328">admin-token, metrics-token</text>
  <text x="272" y="516" font-size="12" fill="#1F2328">cs-key, appi</text>
  <text x="272" y="540" font-size="12" font-weight="bold" fill="#1F2328">No Foundry key in the container</text>

  <!-- Registry -->
  <rect x="40" y="630" width="320" height="80" rx="8" fill="#EDE4F7" stroke="#6D28D9" stroke-width="1.5"/>
  <text x="200" y="656" font-size="15" font-weight="bold" fill="#1F2328" text-anchor="middle">&lt;your-acr-name&gt;</text>
  <text x="200" y="676" font-size="12" fill="#1F2328" text-anchor="middle">Container Registry, Basic</text>
  <text x="200" y="692" font-size="12" fill="#1F2328" text-anchor="middle">admin user disabled</text>

  <!-- Managed identity roles -->
  <line x1="160" y1="395" x2="160" y2="290" stroke="#57606A" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="170" y="322" font-size="12" font-weight="bold" fill="#1F2328">Cognitive Services OpenAI User</text>
  <line x1="160" y1="555" x2="160" y2="630" stroke="#57606A" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="170" y="612" font-size="12" font-weight="bold" fill="#1F2328">AcrPull</text>

  <!-- Outside the RG -->
  <rect x="890" y="380" width="290" height="160" rx="8" fill="#EDE4F7" stroke="#6D28D9" stroke-width="1.5"/>
  <text x="1035" y="402" font-size="15" font-weight="bold" fill="#1F2328" text-anchor="middle">Microsoft Entra ID</text>
  <text x="905" y="422" font-size="12" fill="#1F2328">app registration rahat-github-deploy</text>
  <text x="905" y="438" font-size="12" fill="#1F2328">and its service principal</text>
  <text x="905" y="460" font-size="12" fill="#1F2328">federated credential subject:</text>
  <text x="905" y="476" font-size="12" fill="#1F2328">repo:&lt;OWNER&gt;@&lt;OWNER_ID&gt;/</text>
  <text x="905" y="492" font-size="12" fill="#1F2328">&lt;REPO&gt;@&lt;REPO_ID&gt;:</text>
  <text x="905" y="508" font-size="12" fill="#1F2328">environment:production</text>

  <rect x="890" y="620" width="290" height="80" rx="8" fill="#EDE4F7" stroke="#6D28D9" stroke-width="1.5"/>
  <text x="1035" y="646" font-size="15" font-weight="bold" fill="#1F2328" text-anchor="middle">GitHub Actions</text>
  <text x="1035" y="666" font-size="12" fill="#1F2328" text-anchor="middle">deploy.yml, environment production</text>
  <text x="1035" y="682" font-size="12" fill="#1F2328" text-anchor="middle">no stored Azure secret</text>
  <line x1="1035" y1="620" x2="1035" y2="540" stroke="#57606A" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="1045" y="584" font-size="12" fill="#57606A">OIDC login as the</text>
  <text x="1045" y="600" font-size="12" fill="#57606A">service principal</text>

  <!-- Deploy service principal roles -->
  <line x1="890" y1="440" x2="520" y2="440" stroke="#57606A" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="715" y="432" font-size="12" font-weight="bold" fill="#1F2328" text-anchor="middle">Contributor, on app rahat only</text>
  <path d="M890,520 L700,520 L700,670 L360,670" fill="none" stroke="#57606A" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="710" y="600" font-size="12" font-weight="bold" fill="#1F2328">AcrPush</text>

  <!-- Legend -->
  <rect x="20" y="756" width="16" height="16" fill="#EDE4F7" stroke="#6D28D9"/>
  <text x="42" y="769" font-size="13" fill="#1F2328">Azure or GitHub</text>
  <rect x="180" y="756" width="16" height="16" fill="#DCEBFA" stroke="#1D4ED8"/>
  <text x="202" y="769" font-size="13" fill="#1F2328">our code</text>
  <rect x="300" y="756" width="16" height="16" fill="#FFF6C7" stroke="#A16207"/>
  <text x="322" y="769" font-size="13" fill="#1F2328">storage or secrets</text>
  <text x="480" y="769" font-size="13" fill="#57606A">Nothing is granted at resource group or subscription scope.</text>
</svg>
