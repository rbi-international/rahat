<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="1150" height="760" viewBox="0 0 1150 760" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#F7F3EA"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606A"/>
    </marker>
  </defs>

  <text x="575" y="36" font-size="22" font-weight="bold" fill="#1F2328" text-anchor="middle">How an SOS gets its priority</text>
  <text x="575" y="60" font-size="14" fill="#57606A" text-anchor="middle">The SOP rubric is plain code (src/rahat/rules.py). The model may move its answer by one level at most.</text>

  <!-- Step 1: rubric -->
  <rect x="20" y="80" width="560" height="320" rx="10" fill="#DCEBFA" stroke="#1D4ED8" stroke-width="1.5"/>
  <text x="36" y="106" font-size="16" font-weight="bold" fill="#1F2328">1. SOP score: rules.rubric_score()</text>

  <text x="36" y="134" font-size="13" font-weight="bold" fill="#1F2328">Water level (one value)</text>
  <rect x="36" y="142" width="84" height="30" rx="4" fill="#FFFFFF" stroke="#1D4ED8"/>
  <text x="78" y="162" font-size="12" fill="#1F2328" text-anchor="middle">roof 40</text>
  <rect x="124" y="142" width="84" height="30" rx="4" fill="#FFFFFF" stroke="#1D4ED8"/>
  <text x="166" y="162" font-size="12" fill="#1F2328" text-anchor="middle">chest 32</text>
  <rect x="212" y="142" width="84" height="30" rx="4" fill="#FFFFFF" stroke="#1D4ED8"/>
  <text x="254" y="162" font-size="12" fill="#1F2328" text-anchor="middle">waist 20</text>
  <rect x="300" y="142" width="84" height="30" rx="4" fill="#FFFFFF" stroke="#1D4ED8"/>
  <text x="342" y="162" font-size="12" fill="#1F2328" text-anchor="middle">knee 10</text>
  <rect x="388" y="142" width="84" height="30" rx="4" fill="#FFFFFF" stroke="#1D4ED8"/>
  <text x="430" y="162" font-size="12" fill="#1F2328" text-anchor="middle">ankle 4</text>
  <rect x="476" y="142" width="84" height="30" rx="4" fill="#FFFFFF" stroke="#1D4ED8"/>
  <text x="518" y="162" font-size="12" fill="#1F2328" text-anchor="middle">unknown 12</text>

  <text x="36" y="198" font-size="13" font-weight="bold" fill="#1F2328">+ Vulnerable people (each kind counted once, total max 35)</text>
  <rect x="36" y="206" width="84" height="30" rx="4" fill="#FFFFFF" stroke="#1D4ED8"/>
  <text x="78" y="226" font-size="12" fill="#1F2328" text-anchor="middle">infant 18</text>
  <rect x="124" y="206" width="84" height="30" rx="4" fill="#FFFFFF" stroke="#1D4ED8"/>
  <text x="166" y="226" font-size="12" fill="#1F2328" text-anchor="middle">pregnant 18</text>
  <rect x="212" y="206" width="84" height="30" rx="4" fill="#FFFFFF" stroke="#1D4ED8"/>
  <text x="254" y="226" font-size="12" fill="#1F2328" text-anchor="middle">injured 16</text>
  <rect x="300" y="206" width="84" height="30" rx="4" fill="#FFFFFF" stroke="#1D4ED8"/>
  <text x="342" y="226" font-size="12" fill="#1F2328" text-anchor="middle">disabled 14</text>
  <rect x="388" y="206" width="84" height="30" rx="4" fill="#FFFFFF" stroke="#1D4ED8"/>
  <text x="430" y="226" font-size="12" fill="#1F2328" text-anchor="middle">elderly 12</text>
  <rect x="476" y="206" width="84" height="30" rx="4" fill="#FFFFFF" stroke="#1D4ED8"/>
  <text x="518" y="226" font-size="12" fill="#1F2328" text-anchor="middle">child 10</text>

  <text x="36" y="266" font-size="13" fill="#1F2328"><tspan font-weight="bold">+ People:</tspan> 2 each, max 15</text>
  <text x="36" y="288" font-size="13" fill="#1F2328"><tspan font-weight="bold">+ 10</tspan> if the need is medical</text>
  <text x="36" y="310" font-size="13" fill="#1F2328"><tspan font-weight="bold">+ 10</tspan> if the nearest river gauge is at danger or extreme</text>
  <text x="36" y="340" font-size="13" fill="#1F2328"><tspan font-weight="bold">Cap:</tspan> need is information and water is unknown, ankle or knee:</text>
  <text x="36" y="358" font-size="13" fill="#1F2328">score capped at 19, so it stays P4</text>
  <text x="36" y="384" font-size="13" fill="#1F2328"><tspan font-weight="bold">Total</tspan> capped at 100</text>

  <!-- priority_for -->
  <rect x="20" y="440" width="560" height="110" rx="10" fill="#DCEBFA" stroke="#1D4ED8" stroke-width="1.5"/>
  <text x="36" y="466" font-size="16" font-weight="bold" fill="#1F2328">rules.priority_for(score): the SOP priority</text>
  <rect x="36" y="482" width="122" height="50" rx="6" fill="#FFFFFF" stroke="#1D4ED8"/>
  <text x="97" y="504" font-size="15" font-weight="bold" fill="#1F2328" text-anchor="middle">P1</text>
  <text x="97" y="522" font-size="12" fill="#1F2328" text-anchor="middle">score 65 or more</text>
  <rect x="168" y="482" width="122" height="50" rx="6" fill="#FFFFFF" stroke="#1D4ED8"/>
  <text x="229" y="504" font-size="15" font-weight="bold" fill="#1F2328" text-anchor="middle">P2</text>
  <text x="229" y="522" font-size="12" fill="#1F2328" text-anchor="middle">45 to 64</text>
  <rect x="300" y="482" width="122" height="50" rx="6" fill="#FFFFFF" stroke="#1D4ED8"/>
  <text x="361" y="504" font-size="15" font-weight="bold" fill="#1F2328" text-anchor="middle">P3</text>
  <text x="361" y="522" font-size="12" fill="#1F2328" text-anchor="middle">20 to 44</text>
  <rect x="432" y="482" width="122" height="50" rx="6" fill="#FFFFFF" stroke="#1D4ED8"/>
  <text x="493" y="504" font-size="15" font-weight="bold" fill="#1F2328" text-anchor="middle">P4</text>
  <text x="493" y="522" font-size="12" fill="#1F2328" text-anchor="middle">below 20</text>
  <line x1="300" y1="400" x2="300" y2="440" stroke="#57606A" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="310" y="425" font-size="12" fill="#57606A">score</text>

  <!-- Step 2: model -->
  <rect x="640" y="80" width="490" height="90" rx="10" fill="#FCE3C8" stroke="#C2410C" stroke-width="1.5"/>
  <text x="656" y="106" font-size="16" font-weight="bold" fill="#1F2328">2. Triage agent (agents/specialists.triage)</text>
  <text x="656" y="130" font-size="13" fill="#1F2328">The model reads the extracted facts and SOP score</text>
  <text x="656" y="150" font-size="13" fill="#1F2328">and proposes a priority plus moved_for (the uncounted fact)</text>

  <rect x="640" y="210" width="490" height="90" rx="10" fill="#DCEBFA" stroke="#1D4ED8" stroke-width="1.5"/>
  <text x="656" y="236" font-size="15" font-weight="bold" fill="#1F2328">Reason check</text>
  <text x="656" y="260" font-size="13" fill="#1F2328">Proposal differs from SOP and moved_for is empty:</text>
  <text x="656" y="280" font-size="13" fill="#1F2328">the proposal is dropped and the SOP priority kept.</text>

  <rect x="640" y="340" width="490" height="110" rx="10" fill="#DCEBFA" stroke="#1D4ED8" stroke-width="1.5"/>
  <text x="656" y="366" font-size="15" font-weight="bold" fill="#1F2328">policy.bound_priority(proposed, sop)</text>
  <text x="656" y="390" font-size="13" fill="#1F2328">Clamps the proposal to within one level of SOP.</text>
  <text x="656" y="410" font-size="13" fill="#1F2328">SOP P3: allowed P2, P3 or P4</text>
  <text x="656" y="430" font-size="13" fill="#1F2328">SOP P1: allowed P1 or P2</text>

  <rect x="640" y="490" width="490" height="60" rx="10" fill="#DCEBFA" stroke="#1D4ED8" stroke-width="1.5"/>
  <text x="885" y="515" font-size="15" font-weight="bold" fill="#1F2328" text-anchor="middle">Final priority</text>
  <text x="885" y="537" font-size="13" fill="#1F2328" text-anchor="middle">validated, then shown to the duty officer with the reason</text>

  <line x1="885" y1="170" x2="885" y2="210" stroke="#57606A" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="885" y1="300" x2="885" y2="340" stroke="#57606A" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="895" y="325" font-size="12" fill="#57606A">then, in every case</text>
  <line x1="885" y1="450" x2="885" y2="490" stroke="#57606A" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M580,470 L610,470 L610,395 L640,395" fill="none" stroke="#57606A" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="595" y="490" font-size="12" fill="#57606A" text-anchor="middle">SOP</text>

  <!-- Worked example -->
  <rect x="20" y="590" width="1110" height="120" rx="10" fill="#FFFFFF" stroke="#8C959F" stroke-width="1.5"/>
  <text x="36" y="616" font-size="15" font-weight="bold" fill="#1F2328">Worked example</text>
  <text x="36" y="640" font-size="13" fill="#1F2328">Water at the roof: 40</text>
  <text x="36" y="660" font-size="13" fill="#1F2328">Elderly 12 + injured 16: 28 (under the cap of 35)</text>
  <text x="36" y="680" font-size="13" fill="#1F2328">5 people: 10</text>
  <text x="36" y="700" font-size="13" font-weight="bold" fill="#1F2328">Score 78, SOP P1. The model may only move it to P2, with a reason.</text>

  <rect x="620" y="640" width="96" height="20" fill="#EFEBE3" stroke="#8C959F"/>
  <rect x="716" y="640" width="120" height="20" fill="#E4DED2" stroke="#8C959F"/>
  <rect x="836" y="640" width="96" height="20" fill="#D9D2C3" stroke="#8C959F"/>
  <rect x="932" y="640" width="168" height="20" fill="#CEC5B3" stroke="#8C959F"/>
  <text x="668" y="655" font-size="12" fill="#1F2328" text-anchor="middle">P4</text>
  <text x="776" y="655" font-size="12" fill="#1F2328" text-anchor="middle">P3</text>
  <text x="884" y="655" font-size="12" fill="#1F2328" text-anchor="middle">P2</text>
  <text x="1016" y="655" font-size="12" fill="#1F2328" text-anchor="middle">P1</text>
  <text x="620" y="678" font-size="12" fill="#57606A" text-anchor="middle">0</text>
  <text x="716" y="678" font-size="12" fill="#57606A" text-anchor="middle">20</text>
  <text x="836" y="678" font-size="12" fill="#57606A" text-anchor="middle">45</text>
  <text x="932" y="678" font-size="12" fill="#57606A" text-anchor="middle">65</text>
  <text x="1100" y="678" font-size="12" fill="#57606A" text-anchor="middle">100</text>
  <line x1="994" y1="628" x2="994" y2="672" stroke="#C2410C" stroke-width="2.5"/>
  <text x="1004" y="625" font-size="12" font-weight="bold" fill="#C2410C">78</text>
  <text x="860" y="700" font-size="12" fill="#57606A" text-anchor="middle">score scale</text>

  <!-- Legend -->
  <rect x="20" y="728" width="16" height="16" fill="#FCE3C8" stroke="#C2410C"/>
  <text x="42" y="741" font-size="13" fill="#1F2328">model call</text>
  <rect x="140" y="728" width="16" height="16" fill="#DCEBFA" stroke="#1D4ED8"/>
  <text x="162" y="741" font-size="13" fill="#1F2328">plain code</text>
</svg>
