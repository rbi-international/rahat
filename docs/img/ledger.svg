<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="1100" height="720" viewBox="0 0 1100 720" font-family="Arial, Helvetica, sans-serif">
<rect width="100%" height="100%" fill="#F7F3EA"/>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker>
</defs>
<g fill="#1F2328" font-size="13">
<text x="30" y="40" font-size="22" font-weight="bold">The token ledger (src/rahat/ledger.py)</text>
<text x="80" y="76">allocation = ALLOCATION_TOKENS (default 1,500,000; the live class used 2,500,000)</text>

<!-- reserve curve -->
<path d="M850,130 C850,95 620,95 620,130" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="735" y="98" text-anchor="middle" font-weight="bold">reserve</text>

<!-- bar -->
<rect x="80" y="130" width="480" height="56" fill="#F2D675" stroke="#A16207" stroke-width="1.5"/>
<rect x="560" y="130" width="120" height="56" fill="#FCE3C8" stroke="#C2410C" stroke-width="1.5"/>
<rect x="680" y="130" width="340" height="56" fill="#FFF6C7" stroke="#A16207" stroke-width="1.5"/>
<text x="320" y="155" text-anchor="middle" font-size="14" font-weight="bold">used</text>
<text x="320" y="174" text-anchor="middle" font-size="12">charged, actual provider tokens</text>
<text x="620" y="155" text-anchor="middle" font-size="14" font-weight="bold">reserved</text>
<text x="620" y="174" text-anchor="middle" font-size="12">calls in flight</text>
<text x="800" y="155" text-anchor="middle" font-size="14" font-weight="bold">remaining</text>
<text x="800" y="174" text-anchor="middle" font-size="12">free to reserve</text>
<line x1="926" y1="120" x2="926" y2="196" stroke="#B91C1C" stroke-width="1.5" stroke-dasharray="4,3"/>
<text x="926" y="114" text-anchor="middle" font-size="12" fill="#B91C1C">low line: 10% left</text>

<!-- commit / release curves -->
<path d="M610,186 C610,226 320,226 320,186" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="465" y="236" text-anchor="middle" font-weight="bold">commit</text>
<path d="M650,186 C650,226 850,226 850,186" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="750" y="236" text-anchor="middle" font-weight="bold">release</text>

<text x="550" y="266" text-anchor="middle" font-size="14" font-weight="bold">remaining = allocation - used - reserved</text>
<text x="550" y="290" text-anchor="middle">All three operations run under one threading.Lock, so parallel workers never double-spend.</text>

<!-- ops -->
<rect x="60" y="305" width="300" height="200" rx="8" fill="#DCEBFA" stroke="#1D4ED8" stroke-width="1.5"/>
<text x="76" y="331" font-size="15" font-weight="bold">reserve(estimate)</text>
<text x="76" y="353" font-style="italic">before the model call</text>
<text x="76" y="379">if allocation - used - reserved</text>
<text x="92" y="398">&lt; estimate: raise BudgetExhausted</text>
<text x="76" y="420">else: reserved += estimate</text>
<text x="76" y="446">returns the held amount</text>

<rect x="400" y="305" width="300" height="200" rx="8" fill="#DCEBFA" stroke="#1D4ED8" stroke-width="1.5"/>
<text x="416" y="331" font-size="15" font-weight="bold">commit(reserved, actual, agent)</text>
<text x="416" y="353" font-style="italic">after a successful call</text>
<text x="416" y="379">reserved -= reserved</text>
<text x="416" y="398">used += actual</text>
<text x="432" y="417">(actual = usage.total_tokens)</text>
<text x="416" y="436">calls += 1</text>
<text x="416" y="455">by_agent[agent] += actual</text>
<text x="416" y="485" font-size="12">A non-JSON reply commits the estimate.</text>

<rect x="740" y="305" width="300" height="200" rx="8" fill="#DCEBFA" stroke="#1D4ED8" stroke-width="1.5"/>
<text x="756" y="331" font-size="15" font-weight="bold">release(reserved)</text>
<text x="756" y="353" font-style="italic">after a failed call</text>
<text x="756" y="379">reserved -= reserved</text>
<text x="756" y="398">nothing is charged</text>

<!-- low / exhausted -->
<rect x="60" y="530" width="470" height="76" rx="8" fill="#FFF6C7" stroke="#A16207" stroke-width="1.5"/>
<text x="76" y="556" font-weight="bold">low: remaining &lt;= allocation x LOW_BUDGET_RATIO (0.10)</text>
<text x="76" y="580">complete_json() moves a strong-tier call down to fast.</text>

<rect x="570" y="530" width="470" height="76" rx="8" fill="#FFF6C7" stroke="#A16207" stroke-width="1.5"/>
<text x="586" y="556" font-weight="bold">exhausted: nothing left to reserve</text>
<text x="586" y="580">Every agent uses its SOP rules answer and spends nothing.</text>

<!-- tpm note -->
<rect x="60" y="630" width="980" height="56" rx="8" fill="#EDE4F7" stroke="#6D28D9" stroke-width="1.5"/>
<text x="76" y="654" font-weight="bold">Two different limits</text>
<text x="76" y="674">TPM on each Foundry deployment caps the rate per minute; the ledger caps the total.</text>
</g>
</svg>
