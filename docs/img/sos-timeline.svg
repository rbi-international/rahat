<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="1100" height="620" viewBox="0 0 1100 620" font-family="Arial, Helvetica, sans-serif">
<rect width="100%" height="100%" fill="#F7F3EA"/>
<g fill="#1F2328" font-size="13">
<text x="30" y="40" font-size="22" font-weight="bold">One SOS on the live Foundry lane</text>
<text x="30" y="64">Measured in the v1.0.0 smoke test. Time stamps are when each step reported, in seconds after the SOS entered the workflow.</text>

<!-- grid -->
<g stroke="#D9D2C3" stroke-width="1">
<line x1="240" y1="84" x2="240" y2="486"/>
<line x1="350" y1="84" x2="350" y2="486"/>
<line x1="460" y1="84" x2="460" y2="486"/>
<line x1="570" y1="84" x2="570" y2="486"/>
<line x1="680" y1="84" x2="680" y2="486"/>
<line x1="790" y1="84" x2="790" y2="486"/>
<line x1="900" y1="84" x2="900" y2="486"/>
<line x1="1010" y1="84" x2="1010" y2="486"/>
</g>

<!-- row labels -->
<text x="30" y="110" font-size="14" font-weight="bold">guard</text>
<text x="30" y="127" font-size="12" fill="#57534E">+0.01 s</text>
<text x="30" y="166" font-size="14" font-weight="bold">intake</text>
<text x="30" y="183" font-size="12" fill="#57534E">+4.89 s</text>
<text x="30" y="222" font-size="14" font-weight="bold">geo</text>
<text x="30" y="239" font-size="12" fill="#57534E">+4.89 s</text>
<text x="30" y="278" font-size="14" font-weight="bold">verifier</text>
<text x="30" y="295" font-size="12" fill="#57534E">+4.89 s</text>
<text x="30" y="334" font-size="14" font-weight="bold">triage</text>
<text x="30" y="351" font-size="12" fill="#57534E">+5.82 s</text>
<text x="30" y="390" font-size="14" font-weight="bold">resource (allocate)</text>
<text x="30" y="407" font-size="12" fill="#57534E">+5.82 s</text>
<text x="30" y="446" font-size="14" font-weight="bold">commander</text>
<text x="30" y="463" font-size="12" fill="#57534E">+6.95 s</text>

<!-- guard: code, about 0.19 s -->
<rect x="241" y="101" width="21" height="18" fill="#DCEBFA" stroke="#1D4ED8" stroke-width="1.5"/>
<text x="272" y="115">PII redaction + injection screen, about 0.19 s; code</text>

<!-- intake: model 0.19 to 4.89 -->
<rect x="261" y="150" width="517" height="24" rx="3" fill="#FCE3C8" stroke="#C2410C" stroke-width="1.5"/>
<text x="270" y="166" font-size="12">Foundry, 578 tokens, 4.7 s (includes the first managed-identity token fetch)</text>
<text x="261" y="192" font-size="12">pa, 5 people, water roof, elderly + injured</text>

<!-- geo tick -->
<rect x="775" y="210" width="6" height="24" fill="#DCEBFA" stroke="#1D4ED8" stroke-width="1.5"/>
<text x="765" y="226" text-anchor="end">Batala, Gurdaspur, Ravi; code</text>

<!-- verifier tick -->
<rect x="775" y="266" width="6" height="24" fill="#DCEBFA" stroke="#1D4ED8" stroke-width="1.5"/>
<text x="765" y="282" text-anchor="end">no duplicate, plausible; code</text>

<!-- triage: model 4.92 to 5.82 -->
<rect x="781" y="322" width="99" height="24" rx="3" fill="#FCE3C8" stroke="#C2410C" stroke-width="1.5"/>
<text x="830" y="338" text-anchor="middle" font-size="12">0.9 s</text>
<text x="771" y="330" text-anchor="end">P1: &quot;SOP score already yields P1&quot;</text>
<text x="771" y="347" text-anchor="end" font-size="12">Foundry, 598 tokens</text>

<!-- allocate tick -->
<rect x="877" y="378" width="6" height="24" fill="#DCEBFA" stroke="#1D4ED8" stroke-width="1.5"/>
<text x="867" y="394" text-anchor="end">Boat B-05 from Batala, ETA 8 min; code</text>

<!-- commander: model 5.85 to 6.95 -->
<rect x="884" y="434" width="121" height="24" rx="3" fill="#FCE3C8" stroke="#C2410C" stroke-width="1.5"/>
<text x="944" y="450" text-anchor="middle" font-size="12">1.1 s</text>
<text x="874" y="442" text-anchor="end">plan ready</text>
<text x="874" y="459" text-anchor="end" font-size="12">Foundry, 440 tokens</text>

<!-- axis -->
<line x1="240" y1="486" x2="1010" y2="486" stroke="#374151" stroke-width="1.5"/>
<g font-size="12" text-anchor="middle">
<text x="240" y="504">0 s</text>
<text x="350" y="504">1 s</text>
<text x="460" y="504">2 s</text>
<text x="570" y="504">3 s</text>
<text x="680" y="504">4 s</text>
<text x="790" y="504">5 s</text>
<text x="900" y="504">6 s</text>
<text x="1010" y="504">7 s</text>
</g>

<!-- summary -->
<rect x="30" y="530" width="740" height="56" rx="8" fill="#FFF6C7" stroke="#A16207" stroke-width="1.5"/>
<text x="46" y="554" font-size="14" font-weight="bold">Total: 1,616 tokens in 3 model calls, about 7 s</text>
<text x="46" y="574">Final status: awaiting_approval (the duty officer decides next)</text>

<rect x="800" y="534" width="16" height="16" rx="3" fill="#FCE3C8" stroke="#C2410C"/>
<text x="824" y="547">model call (bar = duration)</text>
<rect x="800" y="562" width="16" height="16" rx="3" fill="#DCEBFA" stroke="#1D4ED8"/>
<text x="824" y="575">plain code step</text>
</g>
</svg>
