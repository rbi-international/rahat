<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="1200" height="1160" viewBox="0 0 1200 1160" font-family="Arial, Helvetica, sans-serif">
<rect width="100%" height="100%" fill="#F7F3EA"/>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker>
</defs>
<g fill="#1F2328" font-size="13">
<text x="20" y="40" font-size="22" font-weight="bold">The model gateway: llm.complete_json()</text>
<text x="20" y="62">Every model call in RAHAT goes through this one function. The caller always gets an answer, and it says if it is degraded.</text>

<!-- entry -->
<rect x="350" y="76" width="500" height="40" rx="8" fill="#DCEBFA" stroke="#1D4ED8" stroke-width="1.5"/>
<text x="600" y="101" text-anchor="middle" font-weight="bold">complete_json(agent, system, user, rules, tier, max_tokens)</text>
<line x1="600" y1="116" x2="600" y2="140" stroke="#374151" stroke-width="1.6" marker-end="url(#ah)"/>

<rect x="480" y="140" width="240" height="40" rx="8" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1.5"/>
<text x="600" y="165" text-anchor="middle" font-weight="bold">PROVIDER == fake?</text>
<line x1="720" y1="160" x2="860" y2="160" stroke="#374151" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="790" y="152" text-anchor="middle" font-size="12">yes</text>
<rect x="860" y="120" width="310" height="80" rx="8" fill="#DCEBFA" stroke="#1D4ED8" stroke-width="1.5"/>
<text x="1015" y="142" text-anchor="middle" font-weight="bold">Fake lane</text>
<text x="1015" y="162" text-anchor="middle">sleep 0.25 to 0.9 s, return rules()</text>
<text x="1015" y="182" text-anchor="middle">commit pretend tokens (estimate - 250)</text>

<line x1="600" y1="180" x2="600" y2="210" stroke="#374151" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="610" y="200" font-size="12">no</text>
<rect x="360" y="210" width="480" height="40" rx="8" fill="#DCEBFA" stroke="#1D4ED8" stroke-width="1.5"/>
<text x="600" y="235" text-anchor="middle">if ledger.low and tier == strong: tier = fast</text>
<line x1="600" y1="250" x2="600" y2="276" stroke="#374151" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="360" y="276" width="480" height="40" rx="8" fill="#DCEBFA" stroke="#1D4ED8" stroke-width="1.5"/>
<text x="600" y="301" text-anchor="middle">estimate = (len(system) + len(user)) // 4 + 400</text>
<line x1="600" y1="316" x2="600" y2="405" stroke="#374151" stroke-width="1.6" marker-end="url(#ah)"/>

<!-- loop frame -->
<rect x="20" y="360" width="1160" height="530" rx="10" fill="none" stroke="#8A8270" stroke-width="1.2" stroke-dasharray="7,4"/>
<text x="34" y="382" font-weight="bold">Loop over attempts</text>

<rect x="300" y="405" width="600" height="60" rx="8" fill="#DCEBFA" stroke="#1D4ED8" stroke-width="1.5"/>
<text x="600" y="425" text-anchor="middle" font-weight="bold">for (lane, tier) in _route_plan(tier):</text>
<text x="600" y="443" text-anchor="middle" font-size="12">(PROVIDER, tier), then (PROVIDER, other tier),</text>
<text x="600" y="459" text-anchor="middle" font-size="12">then (FALLBACK_PROVIDER, fast) if it is set</text>

<line x1="600" y1="465" x2="600" y2="490" stroke="#374151" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="470" y="490" width="260" height="40" rx="8" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1.5"/>
<text x="600" y="515" text-anchor="middle" font-weight="bold">breaker.allow(lane:tier)?</text>
<line x1="470" y1="510" x2="40" y2="510" stroke="#374151" stroke-width="1.6"/>
<text x="380" y="502" text-anchor="middle" font-size="12">no: skip this attempt</text>
<line x1="600" y1="530" x2="600" y2="560" stroke="#374151" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="610" y="550" font-size="12">yes</text>

<rect x="470" y="560" width="260" height="40" rx="8" fill="#DCEBFA" stroke="#1D4ED8" stroke-width="1.5"/>
<text x="600" y="585" text-anchor="middle">held = ledger.reserve(estimate)</text>
<line x1="730" y1="580" x2="1150" y2="580" stroke="#374151" stroke-width="1.6"/>
<text x="940" y="572" text-anchor="middle" font-size="12">BudgetExhausted: stop the loop</text>
<line x1="600" y1="600" x2="600" y2="625" stroke="#374151" stroke-width="1.6" marker-end="url(#ah)"/>

<rect x="330" y="625" width="540" height="60" rx="8" fill="#FCE3C8" stroke="#C2410C" stroke-width="1.5"/>
<text x="600" y="649" text-anchor="middle" font-weight="bold">_call_lane(): OpenAI-compatible chat.completions</text>
<text x="600" y="671" text-anchor="middle">JSON mode, reasoning_effort, max_completion_tokens</text>

<line x1="600" y1="685" x2="177" y2="720" stroke="#374151" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="600" y1="685" x2="452" y2="720" stroke="#374151" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="600" y1="685" x2="727" y2="720" stroke="#374151" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="600" y1="685" x2="1002" y2="720" stroke="#374151" stroke-width="1.6" marker-end="url(#ah)"/>

<!-- outcomes -->
<rect x="50" y="720" width="255" height="130" rx="8" fill="#DCEBFA" stroke="#1D4ED8" stroke-width="1.5"/>
<text x="64" y="742" font-weight="bold">RateLimitError, Timeout,</text>
<text x="64" y="760" font-weight="bold">Connection, LaneError</text>
<text x="64" y="782">ledger.release(held)</text>
<text x="64" y="801">breaker.failure</text>
<text x="64" y="836" font-style="italic">next attempt</text>

<rect x="325" y="720" width="255" height="130" rx="8" fill="#DCEBFA" stroke="#1D4ED8" stroke-width="1.5"/>
<text x="339" y="742" font-weight="bold">HTTP status error</text>
<text x="339" y="764">ledger.release(held)</text>
<text x="339" y="783">breaker.failure only if</text>
<text x="339" y="802">429 or &gt;= 500</text>
<text x="339" y="836" font-style="italic">next attempt</text>

<rect x="600" y="720" width="255" height="130" rx="8" fill="#DCEBFA" stroke="#1D4ED8" stroke-width="1.5"/>
<text x="614" y="742" font-weight="bold">Reply is not JSON</text>
<text x="614" y="764">ledger.commit(held, estimate):</text>
<text x="614" y="783">the tokens were spent</text>
<text x="614" y="802">result: bad_json</text>
<text x="614" y="836" font-style="italic">next attempt</text>

<rect x="875" y="720" width="255" height="130" rx="8" fill="#DCEBFA" stroke="#1D4ED8" stroke-width="1.5"/>
<text x="889" y="742" font-weight="bold">ok</text>
<text x="889" y="764">ledger.commit(held,</text>
<text x="904" y="783">usage.total_tokens)</text>
<text x="889" y="802">breaker.success + metrics</text>
<text x="889" y="821">return LLMResult</text>
<text x="889" y="840">(degraded False)</text>

<!-- next attempt bus -->
<line x1="177" y1="850" x2="177" y2="870" stroke="#374151" stroke-width="1.6"/>
<line x1="452" y1="850" x2="452" y2="870" stroke="#374151" stroke-width="1.6"/>
<line x1="727" y1="850" x2="727" y2="870" stroke="#374151" stroke-width="1.6"/>
<path d="M727,870 L40,870 L40,435 L300,435" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="34" y="700" font-size="12" text-anchor="middle" transform="rotate(-90 34 700)">next attempt</text>

<!-- exit to rules -->
<path d="M900,435 L1150,435 L1150,920" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="1025" y="427" text-anchor="middle" font-size="12">all attempts used</text>

<rect x="930" y="920" width="240" height="90" rx="8" fill="#DCEBFA" stroke="#1D4ED8" stroke-width="1.5"/>
<text x="944" y="942" font-weight="bold">No attempt answered</text>
<text x="944" y="962">return rules() as LLMResult:</text>
<text x="944" y="981">lane &quot;rules&quot;, degraded True,</text>
<text x="944" y="1000">tokens 0</text>

<!-- caller -->
<line x1="895" y1="850" x2="895" y2="1040" stroke="#374151" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M1050,1010 L1050,1070 L910,1070" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="300" y="1040" width="610" height="60" rx="8" fill="#DCEBFA" stroke="#1D4ED8" stroke-width="1.5"/>
<text x="605" y="1064" text-anchor="middle" font-weight="bold">Caller (agents/specialists.py) validates into a pydantic model</text>
<text x="605" y="1086" text-anchor="middle">invalid: falls back to the rules answer</text>

<!-- breaker note -->
<rect x="20" y="910" width="260" height="120" rx="8" fill="#FFF6C7" stroke="#A16207" stroke-width="1.5"/>
<text x="34" y="934" font-weight="bold">CircuitBreaker (llm.py)</text>
<text x="34" y="956">opens after 3 consecutive</text>
<text x="34" y="975">failures on one lane:tier,</text>
<text x="34" y="994">stays open 30 s, then</text>
<text x="34" y="1013">half-open: one probe call</text>

<!-- legend -->
<rect x="20" y="1120" width="16" height="16" rx="3" fill="#FCE3C8" stroke="#C2410C"/>
<text x="44" y="1133">model call</text>
<rect x="150" y="1120" width="16" height="16" rx="3" fill="#DCEBFA" stroke="#1D4ED8"/>
<text x="174" y="1133">plain code</text>
<rect x="280" y="1120" width="16" height="16" rx="3" fill="#FFFFFF" stroke="#1D4ED8"/>
<text x="304" y="1133">decision in code</text>
<rect x="440" y="1120" width="16" height="16" rx="3" fill="#FFF6C7" stroke="#A16207"/>
<text x="464" y="1133">state</text>
</g>
</svg>
